---
version: 2
builds:
  - main: .
    binary: hulak
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/xaaha/hulak/pkg/userFlags.version={{.Version}}
archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - man/hulak.1
      - completions/hulak.zsh
      - completions/hulak.bash
    name_template: '{{ .ProjectName }}_ {{- .Version }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}'
checksum:
  name_template: checksums.txt
homebrew_casks:
  - repository:
      owner: xaaha
      name: homebrew-tap
      token: "{{ .Env.GH_PAT }}"
    homepage: https://github.com/xaaha/hulak
    description: File based API client for terminal nerds
    license: MIT
    # Go 1.27 builds target macOS 13. Without this, Homebrew installs happily
    # on 12 and the binary refuses to launch. The on_macos block is load
    # bearing: a top-level depends_on macos: sets macos_required, which makes
    # the cask refuse to install on Linux Homebrew even though it ships a
    # working on_linux block.

    # postflight_steps replaces a hooks.post.install block: goreleaser renders
    # that one as `postflight`, which Homebrew has deprecated. The staged-path
    # token below is escaped because goreleaser runs this file through Go's
    # text/template before Homebrew ever sees it.
    custom_block: |
      on_macos do
        depends_on macos: :ventura
      end

      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/hulak"]
        end
      end
    binaries:
      - hulak
    manpages:
      - man/hulak.1
    completions:
      bash: completions/hulak.bash
      zsh: completions/hulak.zsh
    caveats: |
      The binary is not signed or notarized. macOS quarantine has been automatically removed.
changelog:
  # GitHub generates the release body from .github/release.yml after this
  # workflow runs (see the "Refresh release notes" step in release.yml).
  # Disable goreleaser's own commit-based changelog so it doesn't get
  # overwritten on every release.
  disable: true
